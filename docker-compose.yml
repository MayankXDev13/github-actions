services:
  frontend:
    image: mayankxdev/github-actions-frontend-test
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "4173:4173"

  nginx:
    image: nginx:latest
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  frontend:
    driver: bridge